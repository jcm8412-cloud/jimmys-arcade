<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jimmy's Arcade</title>
<meta name="description" content="Chalkboard games for kids: Hangman and more. Plays offline.">
<meta name="theme-color" content="#263d30">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jimmy's Arcade">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/gochi-hand-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/patrick-hand-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="shell/style.css">
</head>
<body>
<div class="board" id="board">

  <!-- Home -->
  <section class="screen home" id="scr-home" hidden>
    <div class="home-top">
      <button class="icon-btn" id="btn-players" aria-label="Players">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-4 3-6.5 6.5-6.5s6.5 2.5 6.5 6.5"/><circle cx="17" cy="9" r="2.6"/><path d="M16 13.6c3.5-.3 6 2 6 5.4"/></svg>
      </button>
      <button class="icon-btn" id="btn-settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>
      </button>
    </div>
    <h1 class="logo">Jimmy's <span>Arcade</span></h1>
    <div class="tiles" id="tiles"></div>
  </section>

  <!-- Players -->
  <section class="screen" id="scr-players" hidden>
    <header class="topbar"><div class="tb-left"><button class="icon-btn" data-home aria-label="Home"></button></div><h2>Players</h2><div class="tb-right"></div></header>
    <div class="player-list" id="player-list"></div>
    <button class="btn big" id="btn-add-player">+ Add player</button>
  </section>

  <!-- Add / edit a player -->
  <section class="screen" id="scr-player-edit" hidden>
    <header class="topbar"><div class="tb-left"><button class="icon-btn" id="btn-edit-back" aria-label="Back">&larr;</button></div><h2 id="edit-title">New player</h2><div class="tb-right"></div></header>
    <p class="welcome" id="edit-note" hidden></p>
    <label class="field">
      <span>Name</span>
      <input id="edit-name" type="text" maxlength="14" autocomplete="off" autocapitalize="words" placeholder="Name">
    </label>
    <p class="err" id="edit-err" aria-live="polite"></p>
    <h3 class="label">Pick a picture</h3>
    <div class="avatar-grid" id="avatar-grid" role="radiogroup" aria-label="Picture"></div>
    <button class="btn big" id="btn-save-player">Save</button>
    <button class="btn ghost" id="btn-delete-player">Remove player</button>
  </section>

  <!-- Who's playing? -->
  <section class="screen" id="scr-who" hidden>
    <header class="topbar"><div class="tb-left"><button class="icon-btn" data-home aria-label="Home"></button><button class="back-link" id="who-back">‹ Back</button></div><h2>Who's playing?</h2><div class="tb-right"></div></header>
    <p class="note center-text" id="who-note"></p>
    <div class="who-grid" id="who-grid"></div>
  </section>

  <!-- Settings -->
  <section class="screen" id="scr-settings" hidden>
    <header class="topbar"><div class="tb-left"><button class="icon-btn" data-home aria-label="Home"></button></div><h2>Settings</h2><div class="tb-right"></div></header>
    <div class="settings">
      <label class="toggle"><span>Sound effects</span><input type="checkbox" id="set-sound"><i></i></label>
      <label class="toggle"><span>Vibrate on wrong answers</span><input type="checkbox" id="set-vibrate"><i></i></label>
      <label class="toggle"><span>Read-aloud voice</span><input type="checkbox" id="set-read"><i></i></label>
      <h3 class="label">Picture theme</h3>
      <div class="theme-grid" id="settings-themes" role="radiogroup" aria-label="Picture theme"></div>
      <button class="btn ghost" id="btn-reset-stats">Reset stats</button>
      <p class="note" id="reset-note" aria-live="polite"></p>
    </div>
  </section>

  <!-- Pass the phone (shared by every pass-and-play game) -->
  <section class="screen" id="scr-pass" hidden>
    <header class="topbar"><div class="tb-left"><button class="icon-btn" data-home aria-label="Home"></button></div><h2></h2><div class="tb-right"></div></header>
    <div class="pass-body">
      <p class="pass-small" id="pass-small"></p>
      <div class="pass-avatar" id="pass-avatar"></div>
      <p class="pass-to">Pass the phone to</p>
      <p class="pass-name" id="pass-name"></p>
      <p class="note" id="pass-note"></p>
      <button class="btn big" id="pass-ready">Ready</button>
    </div>
  </section>

  <!-- Each game adds its own screens here -->
  <div id="game-root"></div>

  <!-- Confirm dialog -->
  <div class="dialog" id="dialog" hidden>
    <div class="dialog-box" role="dialog" aria-modal="true" aria-labelledby="dialog-text">
      <p id="dialog-text"></p>
      <div class="row">
        <button class="btn" id="dialog-yes"></button>
        <button class="btn ghost" id="dialog-no">Cancel</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast" aria-live="polite"></div>
</div>

<script src="shell/storage.js"></script>
<script src="shell/avatars.js"></script>
<script src="shell/themes/registry.js"></script>
<script src="shell/themes/classic.js"></script>
<script src="shell/themes/snowman.js"></script>
<script src="shell/themes/balloons.js"></script>
<script src="shell/themes/monster.js"></script>
<script src="shell/themes/pumpkin.js"></script>
<script src="shell/themes/rocket.js"></script>
<script src="games/index.js"></script>
<script src="shell/shell.js"></script>
</body>
</html>
